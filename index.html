#load.open{display:flex}

<body>
<header>
  <div class="top">

<main id="list"><div class="empty">Tippe auf ↻, um die Coins zu laden.</div></main>

<script>
"use strict";
/* =====================================================================
   Altcoin Check – Version 2
   A. Fundament: Umsatz · Tokenomics (Buyback/Burn, Supply, Unlocks) · Utility · Katalysatoren · Marktkapitalisierung
   B. Markt & Timing: Trend gegen BTC · Momentum/Volumen/relative Stärke · Social (X über Grok)
   C. Manuelle Checkliste: Narrativ (1–5) · Influencer-Call
   ===================================================================== */
const CG = "https://api.coingecko.com/api/v3";
const LL = "https://api.llama.fi";
const DAY = 864e5;
const EXCLUDE = new Set(["bitcoin","tether","usd-coin","dai","first-digital-usd","ethena-usde","usds","paypal-usd","true-usd","frax",
 "wrapped-bitcoin","staked-ether","wrapped-steth","weth","wrapped-eeth","rocket-pool-eth","coinbase-wrapped-btc",
 "binance-bridged-usdt-bnb-smart-chain","usd1-wlfi","susds","ethena-staked-usde","binance-peg-weth","lombard-staked-btc"]);
const MAJOR = ["binance","coinbase","okx","bybit","kraken","bitvavo","bitget","kucoin","upbit","gate","htx","crypto.com","bitstamp"];
const GENERIC_CAT = /(ecosystem|portfolio|launchpool|launchpad|holdings|made in|alleged|ftx|index|binance hodler|airdrop|world liberty|coinbase 50|layer 1 \(l1\)|proof of|smart contract platform|governance)/i;

// ---------- Speicher ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(_){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){ } }
};
let settings = Object.assign({ top: 250, cgKey: "", aKey: "", model: "claude-sonnet-5-5", xKey: "", xModel: "grok-4.5" }, store.get("ac_settings", {}));
let results = store.get("ac_results2", []);
let stamp = store.get("ac_stamp2", null);
let btcRow = store.get("ac_btc", null);
const deep = store.get("ac_deep2", {}), social = store.get("ac_social", {}), bm = store.get("ac_bm", {}),
      manual = store.get("ac_manual", {}), full = store.get("ac_full", {});
const mem = { mkt: {}, btc: null, cats: null };
let cur = null;               // aktuell geöffneter Coin
const busy = {};              // laufende KI-Abfragen

// ---------- Helfer ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cls10 = v => v == null ? "na" : v >= 7 ? "g" : v >= 4 ? "y" : "r";
const f1 = v => v == null ? "–" : v.toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
const clamp = (v, a = 0, b = 10) => Math.max(a, Math.min(b, v));
function usd(v){
  if(v == null || v === 0) return "–";
  const u = [[1e9,"Mrd"],[1e6,"Mio"],[1e3,"Tsd"]].find(([d]) => Math.abs(v) >= d);
  return u ? "$" + (v/u[0]).toLocaleString("de-DE",{maximumFractionDigits:2}) + " " + u[1]
           : "$" + v.toLocaleString("de-DE",{maximumSignificantDigits:5});
}
const pct = (v, f = 1, sign = false) => v == null || isNaN(v) ? "–" : (sign && v > 0 ? "+" : "") + (v*f).toLocaleString("de-DE",{maximumFractionDigits:1}) + " %";
const num = (v, d = 1) => v == null || !isFinite(v) ? "–" : v.toLocaleString("de-DE",{maximumFractionDigits:d});
const pnum = v => { const n = parseFloat(String(v ?? "").replace("%", "").replace(",", ".")); return isFinite(n) ? n : 0; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const dstr = t => new Date(t).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"});
function loading(on, txt){ $("#load").classList.toggle("open", on); if(txt) $("#loadTxt").textContent = txt; }
function parseJ(text){
  const a = text.indexOf("{"), z = text.lastIndexOf("}");
  if(a < 0 || z < 0) return null;
  try{ return JSON.parse(text.slice(a, z + 1)); }catch(_){ return null; }
}
async function fetchT(url, opt = {}, ms = 60000){
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms);
  try{ return await fetch(url, Object.assign({}, opt, { signal: ac.signal })); } finally { clearTimeout(t); }
}
async function getJSON(url, headers = {}, tries = 3){
  for(let i = 0; i < tries; i++){
    try{
      const r = await fetchT(url, { headers });
      if(r.status === 429){ await sleep(5000 * (i+1)); continue; }
      if(!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    }catch(e){ if(i === tries-1) throw e; await sleep(1500); }
  }
  throw new Error("Rate-Limit – bitte kurz warten");
}
// CoinGecko-Anfragen nacheinander mit Abstand (kostenloses Limit)
let cgChain = Promise.resolve(), cgLast = 0;
function cg(path){
  const p = cgChain.then(async () => {
    const gap = settings.cgKey ? 1300 : 2600;
    const w = cgLast + gap - Date.now(); if(w > 0) await sleep(w);
    cgLast = Date.now();
    return getJSON(CG + path, settings.cgKey ? { "x-cg-demo-api-key": settings.cgKey } : {});
  });
  cgChain = p.catch(() => {});
  return p;
}

// ---------- Indikatoren ----------
function smaSeries(a, n){ const o = []; let s = 0; for(let i = 0; i < a.length; i++){ s += a[i]; if(i >= n) s -= a[i-n]; o.push(i >= n-1 ? s/n : null); } return o; }
function rsi(a, n = 14){
  if(a.length < n + 1) return null;
  let g = 0, l = 0;
  for(let i = 1; i <= n; i++){ const d = a[i] - a[i-1]; if(d > 0) g += d; else l -= d; }
  g /= n; l /= n;
  for(let i = n + 1; i < a.length; i++){ const d = a[i] - a[i-1]; g = (g*(n-1) + Math.max(d,0))/n; l = (l*(n-1) + Math.max(-d,0))/n; }
  return l === 0 ? 100 : 100 - 100/(1 + g/l);
}
function ema(a, n){ const k = 2/(n+1), o = []; let e = a[0]; a.forEach((v, i) => { e = i ? v*k + e*(1-k) : v; o.push(e); }); return o; }
function macd(a){
  if(a.length < 35) return null;
  const e12 = ema(a, 12), e26 = ema(a, 26), m = a.map((_, i) => e12[i] - e26[i]), s = ema(m, 9), h = m.map((v, i) => v - s[i]);
  return { hist: h[h.length-1], prev: h[h.length-2], line: m[m.length-1] };
}
const chg = (a, d) => a.length > d && a[a.length-1-d] ? a[a.length-1]/a[a.length-1-d] - 1 : null;
const avg = a => a.length ? a.reduce((s, v) => s + v, 0)/a.length : null;
function median(a){ const b = a.filter(v => v != null && isFinite(v)).sort((x, y) => x - y); return b.length ? b[Math.floor(b.length/2)] : null; }

// ---------- Liste laden ----------
async function loadAll(){
  loading(true, "Lade Marktdaten (CoinGecko) …");
  const coins = []; let page = 1;
  while(coins.length < settings.top){
    const per = Math.min(250, settings.top - coins.length);
    const d = await cg(`/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=${per}&page=${page}&price_change_percentage=7d,30d,1y`);
    if(!d || !d.length) break;
    coins.push(...d); page++;
    if(d.length < per) break;
  }
  const b = coins.find(c => c.id === "bitcoin");
  if(b) btcRow = { ch7: b.price_change_percentage_7d_in_currency, ch30: b.price_change_percentage_30d_in_currency, ch1y: b.price_change_percentage_1y_in_currency };
  const alts = coins.filter(c => !EXCLUDE.has(c.id) && !(/(usd|eur)/i.test(c.symbol || "") && c.current_price > 0.9 && c.current_price < 1.2));

  loading(true, "Lade Protokolle & TVL (DefiLlama) …");
  const [protocols, chains] = await Promise.all([ getJSON(`${LL}/protocols`).catch(() => []), getJSON(`${LL}/v2/chains`).catch(() => []) ]);
  const gmap = {}, tvl = {};
  for(const p of protocols){
    if(!p.gecko_id) continue;
    for(const k of [p.slug, p.name]) if(k) gmap[k.toLowerCase()] = p.gecko_id;
    if(typeof p.tvl === "number") tvl[p.gecko_id] = (tvl[p.gecko_id] || 0) + p.tvl;
  }
  for(const c of chains){
    if(!c.gecko_id) continue;
    if(c.name && !gmap[c.name.toLowerCase()]) gmap[c.name.toLowerCase()] = c.gecko_id;
    if(typeof c.tvl === "number") tvl[c.gecko_id] = Math.max(tvl[c.gecko_id] || 0, c.tvl);
  }
  loading(true, "Lade Gebühren, Umsatz & Buybacks (DefiLlama) …");
  const [fees, rev, hold] = await Promise.all(["dailyFees","dailyRevenue","dailyHoldersRevenue"].map(t => loadFees(t, gmap)));

  loading(true, "Bewerte …");
  results = alts.map(c => analyze(c, fees, rev, hold, tvl));
  const med30 = median(results.map(r => r.ch30));
  results.forEach(r => r.med30 = med30);
  stamp = Date.now();
  store.set("ac_results2", results); store.set("ac_stamp2", stamp); store.set("ac_btc", btcRow);
  loading(false);
  render();
}
async function loadFees(type, gmap){
  const d = await getJSON(`${LL}/overview/fees?excludeTotalDataChart=true&excludeTotalDataChartBreakdown=true&dataType=${type}`).catch(() => ({}));
  const out = {};
  for(const p of (d.protocols || [])){
    let gid = p.gecko_id;
    if(!gid) for(const k of [p.slug, p.name, p.displayName]) if(k && gmap[k.toLowerCase()]){ gid = gmap[k.toLowerCase()]; break; }
    if(!gid) continue;
    const e = out[gid] || (out[gid] = { d30: 0, y1: 0, src: [] });
    e.d30 += +p.total30d || 0; e.y1 += +p.total1y || 0; e.src.push(p.displayName || p.name);
  }
  return out;
}
function annual(e){ if(!e) return 0; const a = e.d30 * 365/30; return a > 0 ? a : e.y1; }
const up = (v, steps) => { for(const [t, p] of steps) if(v >= t) return p; return 0; };
const down = (v, steps) => { for(const [t, p] of steps) if(v <= t) return p; return steps[steps.length-1][1]; };

function analyze(c, fees, rev, hold, tvlMap){
  const mc = c.market_cap || 0, fdv = c.fully_diluted_valuation || 0, circ = c.circulating_supply || 0;
  const fin = c.max_supply || c.total_supply || 0;
  const r = { id: c.id, sym: (c.symbol || "").toUpperCase(), name: c.name, rank: c.market_cap_rank, img: c.image,
    price: c.current_price, mc, fdv, vol: c.total_volume || 0, ath: c.ath_change_percentage,
    ch7: c.price_change_percentage_7d_in_currency, ch30: c.price_change_percentage_30d_in_currency, ch1y: c.price_change_percentage_1y_in_currency,
    feesY: annual(fees[c.id]), revY: annual(rev[c.id]), holdY: annual(hold[c.id]), tvl: tvlMap[c.id] || 0,
    maxSupply: c.max_supply, src: (rev[c.id] || fees[c.id] || {}).src || [] };
  // 1 Umsatz (0–100)
  r.ps = r.revY > 0 && mc > 0 ? mc / r.revY : null;
  r.s1 = r.ps == null ? 0 : down(r.ps, [[10,100],[25,80],[50,60],[100,40],[300,20],[Infinity,10]]);
  // Value Capture (0–100)
  r.hy = r.holdY > 0 && mc > 0 ? r.holdY / mc * 100 : null;
  r.cap = r.holdY > 0 && r.revY > 0 ? r.holdY / r.revY : null;
  r.s2 = r.hy == null ? 0 : up(r.hy, [[8,100],[5,85],[3,70],[1.5,55],[0.5,35],[0.0001,15]]);
  // 3 Utility (0–100)
  let u = r.feesY > 0 && mc > 0 ? up(r.feesY/mc*100, [[10,100],[5,80],[2,60],[0.5,40],[0.0001,20]]) : 0;
  if(r.tvl > 0 && mc > 0){ const t = up(r.tvl/mc, [[2,80],[1,65],[0.5,50],[0.1,30],[0.0001,10]]); u = u ? Math.round(u*.75 + t*.25) : t; }
  r.s3 = u;
  // Supply (0–100)
  r.circ = circ > 0 && fin ? Math.min(circ/fin, 1) : null;
  r.s4 = r.circ == null ? 0 : up(r.circ, [[0.9,100],[0.75,80],[0.6,65],[0.45,45],[0.3,30],[0,10]]);
  if(r.circ != null && !c.max_supply) r.s4 = Math.min(r.s4, 70);
  r.fdvmc = mc && fdv ? fdv/mc : null;
  r.liq = mc ? r.vol/mc : null;
  return r;
}

// ---------- Kategorie-Scores 0–10 ----------
const CATS = [
  ["rev","Umsatz","A"],["tok","Tokenomics","A"],["util","Utility","A"],["kat","Katalysatoren","A"],["val","Bewertung","A"],
  ["btc","Trend vs BTC","B"],["mom","Momentum","B"],["soc","Social X","B"],["nar","Narrativ","C"]];
const WEIGHT = { rev:1.5, tok:1.5, util:1.2, kat:0.8, val:1.0, btc:1.0, mom:0.8, soc:0.5, nar:0.7 };
const mix = (a, b) => a == null ? b : b == null ? a : (a + b)/2;

function valuationScore(r, m){
  const parts = [];
  if(r.fdvmc != null) parts.push(down(r.fdvmc, [[1.2,10],[1.5,8],[2,6],[3,4],[Infinity,2]]));
  if(r.liq != null) parts.push(up(r.liq, [[0.05,10],[0.02,8],[0.01,6],[0.003,4],[0,2]]));
  if(m && m.leaderX != null) parts.push(m.leaderX <= 1.01 ? 5 : up(m.leaderX, [[20,9],[4,8],[1.3,6],[0,5]]));
  return parts.length ? avg(parts) : null;
}
function listScore(r){
  const v = valuationScore(r, null);
  const tok = (r.s2 + r.s4)/20;
  return Math.round(((r.s1/10)*1.5 + tok*1.5 + (r.s3/10)*1.2 + (v ?? 5)*1.0)/5.2*10)/10;
}
function scores(r){
  const d = deep[r.id], s = social[r.id], m = mem.mkt[r.id], man = manual[r.id] || {};
  const c = {};
  c.rev = mix(r.revY > 0 ? r.s1/10 : (d ? null : 0), d?.revenue?.score);
  let tok = mix((r.s2 + r.s4)/20, d?.tokenomics?.score);
  if(r.circ != null && r.circ < 0.4) tok -= 1.5;
  if(unlock30(r.id)?.big) tok -= 1.5;
  if(d?.tokenomics?.insider_majority === true) tok -= 1.5;
  c.tok = clamp(tok);
  c.util = mix(r.s3 > 0 ? r.s3/10 : (d ? null : 0), d?.utility?.score);
  c.kat = d?.catalysts?.score ?? null;
  c.val = valuationScore(r, m);
  c.btc = m ? m.btcScore : null;
  c.mom = m ? m.momScore : null;
  c.soc = s?.score ?? d?.social_fallback?.score ?? null;
  c.nar = man.narrative ? man.narrative * 2 : null;
  for(const k in c) if(c[k] != null) c[k] = clamp(c[k]);
  let sw = 0, sv = 0;
  for(const [k] of CATS) if(c[k] != null){ sw += WEIGHT[k]; sv += c[k]*WEIGHT[k]; }
  let overall = sw ? sv/sw : null;
  const fl = flags(r);
  const reds = fl.filter(f => f.s === "r" && !f.info);
  if(overall != null){
    overall -= reds.filter(f => f.k !== "infl").length * 0.4;
    if(man.influencer === true) overall -= 1;
    overall = Math.round(clamp(overall)*10)/10;
  }
  return { c, overall, flags: fl, complete: !!d && !!m };
}

// ---------- Unlocks & Warnsignale ----------
function unlocksOf(id){
  const u = deep[id]?.tokenomics?.unlocks;
  if(!Array.isArray(u)) return [];
  return u.map(x => ({ ...x, t: Date.parse(x.date), pct_circ: pnum(x.pct_circ) })).filter(x => !isNaN(x.t) && x.t >= Date.now() - DAY).sort((a, b) => a.t - b.t);
}
function unlock30(id){
  const d = deep[id]; if(!d) return null;
  const in30 = unlocksOf(id).filter(u => u.t <= Date.now() + 30*DAY);
  const big = in30.some(u => +u.pct_circ >= 2) || d.tokenomics?.large_unlock_30d === true;
  return { big, list: in30 };
}
function flags(r){
  const d = deep[r.id], m = mem.mkt[r.id], man = manual[r.id] || {};
  const F = [];
  F.push({ k:"circ", t:"Weniger als 40 % im Umlauf", s: r.circ == null ? "na" : r.circ < 0.4 ? "r" : "g", x: r.circ != null ? pct(r.circ,100) + " im Umlauf" : "keine Angebotsdaten" });
  const u30 = unlock30(r.id);
  F.push({ k:"u30", t:"Großer Unlock in den nächsten 30 Tagen", s: !u30 ? "na" : u30.big ? "r" : "g",
    x: !u30 ? "wird mit der KI-Analyse geprüft" : u30.list.length ? u30.list.map(u => `${dstr(u.t)}: ${num(+u.pct_circ)} % vom Umlauf`).join(", ") : "kein großer Unlock gefunden" });
  const nx = unlocksOf(r.id)[0];
  F.push({ k:"next", info:true, t:"Nächster Unlock", s: nx ? "y" : "na",
    x: nx ? `${dstr(nx.t)} · ${esc(nx.tokens || "")} ${nx.usd ? "(" + esc(nx.usd) + ")" : ""} · ${num(+nx.pct_circ)} % vom Umlauf · an ${esc(nx.recipient || "?")}` : d ? "kein anstehender Unlock gefunden" : "wird mit der KI-Analyse geprüft" });
  const noRev = r.revY === 0 && !(d && d.revenue?.score >= 4);
  const noCap = r.holdY === 0 && !(d && d.tokenomics?.has_value_capture === true);
  F.push({ k:"rev", t:"Kein Umsatz oder nichts fließt an den Token", s: (noRev || noCap) ? "r" : "g",
    x: noRev ? "kein nachweisbarer Umsatz" : noCap ? "Umsatz vorhanden, aber kein Buyback/Burn/Fee-Share" : "Umsatz fließt teilweise an Holder" });
  const im = d?.tokenomics?.insider_majority;
  F.push({ k:"ins", t:"Team & Insider halten die Mehrheit", s: im === true ? "r" : im === false ? "g" : "na",
    x: d?.tokenomics?.insider_share_pct != null ? `Insider-Anteil ca. ${num(pnum(d.tokenomics.insider_share_pct))} %` : d ? "keine genauen Angaben gefunden" : "wird mit der KI-Analyse geprüft" });
  F.push({ k:"ex", t:"Nur auf einer kleinen Börse handelbar", s: !m ? "na" : m.major.length ? "g" : "r",
    x: !m ? "lädt …" : m.major.length ? "gelistet u. a. auf " + esc(m.major.slice(0, 5).join(", ")) : `keine große Börse (${m.exCount} Handelsplätze)` });
  F.push({ k:"infl", t:"Kenne ich aus einem Influencer-Call", s: man.influencer === true ? "r" : man.influencer === false ? "g" : "na",
    x: man.influencer == null ? "in der Checkliste unten beantworten" : man.influencer ? "Ja – besonders vorsichtig sein" : "Nein" });
  return F;
}

// ---------- Markt & Timing (Detaildaten) ----------
function pickCategory(cats){ return (cats || []).find(c => c && !GENERIC_CAT.test(c)) || null; }
async function loadMarket(id){
  const hit = mem.mkt[id]; if(hit && Date.now() - hit.at < 30*60e3) return hit;
  const detail = await cg(`/coins/${encodeURIComponent(id)}?localization=false&tickers=true&market_data=true&community_data=false&developer_data=false&sparkline=false`);
  const chart = await cg(`/coins/${encodeURIComponent(id)}/market_chart?vs_currency=usd&days=365&interval=daily`);
  if(!mem.btc || Date.now() - mem.btc.at > 3*3600e3) mem.btc = { at: Date.now(), d: await cg(`/coins/bitcoin/market_chart?vs_currency=usd&days=365&interval=daily`) };
  if(!mem.cats) mem.cats = await cg(`/coins/categories`).catch(() => []);
  const catName = pickCategory(detail.categories);
  const catObj = (mem.cats || []).find(c => c.name === catName);
  const peers = catObj ? await cg(`/coins/markets?vs_currency=usd&category=${encodeURIComponent(catObj.id)}&order=market_cap_desc&per_page=10&page=1&price_change_percentage=30d`).catch(() => []) : [];
  const m = computeMarket(results.find(x => x.id === id), detail, chart, mem.btc.d, peers, catName);
  mem.mkt[id] = m;
  return m;
}
function computeMarket(r, detail, chart, btc, peers, catName){
  const bmap = new Map((btc.prices || []).map(([t, p]) => [Math.floor(t/DAY), p]));
  const rows = (chart.prices || []).map(([t, p]) => ({ t, p, b: bmap.get(Math.floor(t/DAY)) })).filter(x => x.p && x.b);
  const px = rows.map(x => x.p), ratio = rows.map(x => x.p/x.b), ts = rows.map(x => x.t), bx = rows.map(x => x.b);
  const vols = (chart.total_volumes || []).map(v => v[1]).filter(v => v > 0);
  const n = px.length - 1;
  const s50 = smaSeries(px, 50), s200 = smaSeries(px, 200), r50 = smaSeries(ratio, 50), r200 = smaSeries(ratio, 200);
  const perf = {};
  for(const d of [7, 30, 90, 365]){ const u = chg(px, d), b = chg(bx, d); perf[d] = { usd: u, btcUsd: b, vsBtc: chg(ratio, d) }; }
  const m = {
    at: Date.now(), ts, px, ratio, bx, r50, r200,
    price: px[n], sma50: s50[n], sma200: s200[n], rsma50: r50[n], rsma200: r200[n],
    rsi: rsi(px), macd: macd(px), perf,
    vol7: avg(vols.slice(-7)), vol30: avg(vols.slice(-30)), days: px.length,
    rs30: r && r.ch30 != null && r.med30 != null ? r.ch30 - r.med30 : null,
    desc: (detail.description?.en || "").replace(/<[^>]+>/g, "").trim(),
    categories: detail.categories || [], catName, homepage: detail.links?.homepage?.[0] || "",
    twitter: detail.links?.twitter_screen_name || ""
  };
  m.volRatio = m.vol7 && m.vol30 ? m.vol7/m.vol30 : null;
  // Börsen
  const names = [...new Set((detail.tickers || []).map(t => t.market?.name).filter(Boolean))];
  m.exCount = names.length;
  m.major = names.filter(nm => MAJOR.some(k => nm.toLowerCase().includes(k)));
  // Vergleich mit Konkurrenz (gleiche Kategorie)
  m.peers = (peers || []).map(p => ({ id: p.id, sym: (p.symbol || "").toUpperCase(), name: p.name, mc: p.market_cap, ch30: p.price_change_percentage_30d_in_currency }));
  const leader = m.peers.find(p => p.mc);
  m.leaderX = leader && r && r.mc ? leader.mc / r.mc : null;
  m.leader = leader || null;
  // Score Trend vs BTC (0–10)
  let b = 0;
  if(m.rsma50 != null && ratio[n] > m.rsma50) b += 3;
  if(m.rsma200 != null && ratio[n] > m.rsma200) b += 3;
  if(m.rsma50 != null && m.rsma200 != null && m.rsma50 > m.rsma200) b += 2;
  if(perf[90].vsBtc != null && perf[90].vsBtc > 0) b += 2;
  if(m.rsma200 == null){ b = b * 10/5; } // junger Coin: nur 50-Tage-Linie + 90 Tage verfügbar
  m.btcScore = clamp(b);
  // Score Momentum (0–10)
  let mo = 0;
  const R = m.rsi;
  if(R != null) mo += R > 72 ? 0.5 : R >= 65 ? 2 : R >= 50 ? 3 : R >= 40 ? 2 : R >= 30 ? 1.5 : 1;
  if(m.macd){ if(m.macd.hist > 0) mo += 2; if(m.macd.hist > m.macd.prev) mo += 1; }
  if(m.volRatio != null) mo += m.volRatio >= 1.5 ? 2.5 : m.volRatio >= 1.15 ? 2 : m.volRatio >= 0.9 ? 1 : 0.3;
  if(m.rs30 != null) mo += m.rs30 > 10 ? 1.5 : m.rs30 > 0 ? 1 : 0;
  m.momScore = clamp(mo);
  m.late = lateCheck(m, r);
  return m;
}
// Ist es schon zu spät?
function lateCheck(m, r){
  const above200 = m.sma200 ? m.price/m.sma200 - 1 : null;
  const v90 = m.perf[90].vsBtc, v30 = m.perf[30].vsBtc, R = m.rsi;
  const ratioNow = m.ratio[m.ratio.length-1];
  const why = [];
  if(R != null) why.push(`RSI ${num(R, 0)} ${R > 70 ? "(überkauft)" : R < 30 ? "(überverkauft)" : ""}`);
  if(above200 != null) why.push(`${pct(above200, 100, true)} gegenüber der 200-Tage-Linie`);
  if(v30 != null) why.push(`30 Tage gegen BTC: ${pct(v30, 100, true)}`);
  if(v90 != null) why.push(`90 Tage gegen BTC: ${pct(v90, 100, true)}`);
  if(r && r.ath != null) why.push(`${pct(r.ath, 1, true)} vom Allzeithoch`);
  let lvl, t;
  if((R != null && R > 75) || (above200 != null && above200 > 1) || (v90 != null && v90 > 1.5)){
    lvl = "r"; t = "Wahrscheinlich zu spät – stark heiß gelaufen";
  } else if((R != null && R > 68) || (above200 != null && above200 > 0.5) || (v30 != null && v30 > 0.5) || (v90 != null && v90 > 0.8)){
    lvl = "y"; t = "Spät – Rücksetzer abwarten";
  } else if(m.rsma50 != null && ratioNow < m.rsma50 && (m.rsma200 == null || ratioNow < m.rsma200) && m.macd && m.macd.hist < 0){
    lvl = "y"; t = "Abwärtstrend gegen BTC – noch kein Einstiegssignal";
  } else if(m.rsma50 != null && ratioNow > m.rsma50 && (m.rsma200 == null || ratioNow < m.rsma200 * 1.15) && (R == null || R < 65)){
    lvl = "g"; t = "Früh – Trend gegen BTC dreht nach oben";
  } else if(m.rsma50 != null && ratioNow > m.rsma50){
    lvl = "g"; t = "Im Aufwärtstrend, nicht überhitzt";
  } else { lvl = "na"; t = "Neutral – kein klares Signal"; }
  return { lvl, t, why };
}

// ---------- Grafiken (SVG) ----------
function radar(c){
  const n = CATS.length, cx = 190, cy = 150, R = 92;
  const pt = (i, v) => { const a = (-90 + i*360/n) * Math.PI/180; return [cx + Math.cos(a)*R*v/10, cy + Math.sin(a)*R*v/10]; };
  let g = "";
  for(const lv of [2, 4, 6, 8, 10]) g += `<polygon points="${CATS.map((_, i) => pt(i, lv).join(",")).join(" ")}" fill="none" stroke="#262b36"/>`;
  CATS.forEach((_, i) => { const [x, y] = pt(i, 10); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#262b36"/>`; });
  const poly = CATS.map(([k], i) => pt(i, c[k] ?? 0).join(",")).join(" ");
  g += `<polygon points="${poly}" fill="rgba(59,130,246,.28)" stroke="#3b82f6" stroke-width="2"/>`;
  CATS.forEach(([k, l], i) => {
    const [x, y] = pt(i, c[k] ?? 0); if(c[k] != null) g += `<circle cx="${x}" cy="${y}" r="3" fill="#3b82f6"/>`;
    const [lx, ly] = pt(i, 12.2); const anc = Math.abs(lx - cx) < 8 ? "middle" : lx > cx ? "start" : "end";
    g += `<text x="${lx}" y="${ly}" font-size="11" fill="${c[k] == null ? "#5b6275" : "#c9cdd8"}" text-anchor="${anc}" dominant-baseline="middle">${l} ${c[k] == null ? "–" : f1(c[k])}</text>`;
  });
  return `<svg viewBox="0 0 380 300" width="100%" style="max-width:420px;display:block;margin:0 auto">${g}</svg>`;
}
function bars(c){
  const col = v => v == null ? "#4b5263" : v >= 7 ? "var(--g)" : v >= 4 ? "var(--y)" : "var(--r)";
  return `<div class="bars">${CATS.map(([k, l]) => `<div class="bl"><span>${l}</span><div class="track"><div class="fill" style="width:${(c[k] ?? 0)*10}%;background:${col(c[k])}"></div></div><span>${f1(c[k])}</span></div>`).join("")}</div>`;
}
function lineChart(series, opt = {}){
  const W = 340, H = opt.h || 190, L = 44, Rr = 8, T = 22, B = 22;
  const all = series.flatMap(s => s.pts.filter(p => p[1] != null));
  if(!all.length) return `<div class="hint">Keine Chartdaten.</div>`;
  const t0 = Math.min(...all.map(p => p[0])), t1 = Math.max(...all.map(p => p[0]));
  let v0 = Math.min(...all.map(p => p[1])), v1 = Math.max(...all.map(p => p[1]));
  if(v0 === v1){ v0 *= 0.95; v1 *= 1.05; }
  const X = t => L + (t - t0)/(t1 - t0 || 1)*(W - L - Rr), Y = v => T + (1 - (v - v0)/(v1 - v0))*(H - T - B);
  const fmt = opt.fmt || (v => num(v, 0));
  let g = "";
  for(let i = 0; i <= 3; i++){ const v = v0 + (v1 - v0)*i/3, y = Y(v); g += `<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="#262b36"/><text x="${L-4}" y="${y}" font-size="9" fill="#8a91a3" text-anchor="end" dominant-baseline="middle">${fmt(v)}</text>`; }
  for(const t of [t0, (t0 + t1)/2, t1]) g += `<text x="${X(t)}" y="${H-6}" font-size="9" fill="#8a91a3" text-anchor="${t === t0 ? "start" : t === t1 ? "end" : "middle"}">${dstr(t)}</text>`;
  if(opt.base != null) g += `<line x1="${L}" x2="${W-Rr}" y1="${Y(opt.base)}" y2="${Y(opt.base)}" stroke="#5b6275" stroke-dasharray="3 3"/>`;
  let lx = L;
  for(const s of series){
    const d = s.pts.filter(p => p[1] != null).map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 1.8}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""}/>`;
    g += `<rect x="${lx}" y="5" width="10" height="3" fill="${s.color}"/><text x="${lx + 13}" y="8" font-size="9.5" fill="#c9cdd8" dominant-baseline="middle">${s.name}</text>`;
    lx += 22 + s.name.length*5.8;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function unlockChart(list){
  if(!list.length) return "";
  const mx = Math.max(5, ...list.map(u => +u.pct_circ || 0));
  return `<div class="bars" style="margin-top:8px">${list.slice(0, 12).map(u => {
    const p = +u.pct_circ || 0, c = p >= 2 ? "var(--r)" : p >= 1 ? "var(--y)" : "var(--g)";
    return `<div class="bl"><span>${dstr(u.t)}</span><div class="track"><div class="fill" style="width:${p/mx*100}%;background:${c}"></div></div><span style="width:52px">${num(p)} %</span></div>`;
  }).join("")}</div><div class="hint">Balken = Anteil vom aktuellen Umlauf, der an dem Tag frei wird (rot ab 2 %).</div>`;
}

// ---------- KI ----------
async function claude(prompt, maxUses, maxTokens){
  const res = await fetchT("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "content-type": "application/json", "x-api-key": settings.aKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model: settings.model, max_tokens: maxTokens,
      tools: [{ type: "web_search_20250305", name: "web_search", max_uses: maxUses }],
      messages: [{ role: "user", content: prompt }] })
  }, 240000);
  const j = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error((j.error && j.error.message) || "HTTP " + res.status);
  return (j.content || []).filter(x => x.type === "text").map(x => x.text).join("");
}
async function grok(prompt){
  let res;
  try{
    res = await fetchT("https://api.x.ai/v1/responses", {
      method: "POST",
      headers: { "content-type": "application/json", "authorization": "Bearer " + settings.xKey },
      body: JSON.stringify({ model: settings.xModel, input: [{ role: "user", content: prompt }], tools: [{ type: "x_search" }] })
    }, 240000);
  }catch(e){
    throw new Error(e.name === "AbortError" ? "Zeitüberschreitung" : "Grok lässt keine Anfragen direkt aus dem Browser zu (CORS) – Social läuft dann über die Websuche");
  }
  const j = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error((j.error && (j.error.message || j.error)) || j.message || "HTTP " + res.status);
  let t = j.output_text || "";
  if(!t) for(const o of (j.output || [])) if(o.type === "message") for(const c of (o.content || [])) if(c.text) t += c.text;
  return t;
}
function metrics(r){
  const m = mem.mkt[r.id];
  return [`- Kurs ${usd(r.price)}, Market Cap ${usd(r.mc)}, FDV ${usd(r.fdv)}, Rang #${r.rank}`,
    `- Gebühren/Jahr ${usd(r.feesY)}, Protokoll-Umsatz/Jahr ${usd(r.revY)}, Holders Revenue/Jahr ${usd(r.holdY)}, TVL ${usd(r.tvl)}`,
    `- Im Umlauf ${pct(r.circ, 100)} des Endangebots, Max-Supply ${r.maxSupply ? num(r.maxSupply, 0) : "keiner/unbekannt"}`,
    m ? `- Kategorie: ${m.catName || "?"}; gelistet auf: ${m.major.join(", ") || "keiner großen Börse"} (${m.exCount} Handelsplätze)` : ""].join("\n");
}
async function genBusinessModel(r){
  const id = r.id; busy["bm" + id] = true; if(cur && cur.id === id) renderDetail();
  try{
    const t = await claude(`Erkläre auf Deutsch in 5–7 einfachen Sätzen das Geschäftsmodell von ${r.name} (${r.sym}, CoinGecko-ID "${id}"):
Was macht das Projekt? Wer sind die Kunden/Nutzer und wofür zahlen sie? Wie verdient das Projekt Geld? Welche Rolle spielt der Token dabei (nur Spekulation, Gebühren, Governance, Staking, Sicherheit …)?
Nutze die Websuche, wenn du dir nicht sicher bist. Schreibe für Einsteiger, ohne Marketing-Sprache, ohne Überschriften und ohne Aufzählungen. Antworte nur mit dem Text.`, 3, 1200);
    bm[id] = { text: t.trim(), date: new Date().toLocaleDateString("de-DE") }; store.set("ac_bm", bm);
  }catch(e){ if(cur && cur.id === id) cur.err.bm = "Geschäftsmodell: " + e.message; }
  busy["bm" + id] = false;
  if(cur && cur.id === id) renderDetail();
}

Bekannte Kennzahlen (DefiLlama/CoinGecko, evtl. lückenhaft):
${metrics(r)}

Prüfe genau, knapp und mit Zahlen:
1. REVENUE: Erzielt das Projekt echten Umsatz? Woher? Wie hoch, Trend?
2. TOKENOMICS:
   a) Rückkauf (Buyback) und Burn: Gibt es sie? Wie viel % vom Umsatz, seit wann, beschlossen oder nur geplant?
   b) Angebot: Anteil im Umlauf, FDV, jährliche Inflation/Emission in %.
   c) Anstehende Unlocks der nächsten 12 Monate: genaues Datum, Menge in Tokens, Wert in $, % vom aktuellen Umlauf, Empfänger (Team, Investoren, Ökosystem …). Quellen z. B. Tokenomist, DefiLlama Unlocks, CryptoRank, Projekt-Doku.
   d) Halten Team und Insider (Team + Investoren + Foundation) die Mehrheit des Angebots?
   e) Wird das Angebot unterm Strich knapper (Burn/Buyback > neue Tokens) oder größer?
3. UTILITY: Wofür wird Token/Produkt real genutzt? Nutzer, Aktivität, Abhängigkeit von Incentives?
4. KATALYSATOREN (6–12 Monate): Kooperationen, Upgrades, Listings, ETF, Regulierung, Veränderungen im Marktumfeld – positiv und negativ, mit Datum falls bekannt.
5. NARRATIV: Zu welchem Narrativ/Sektor gehört der Coin (z. B. AI, RWA, DePIN, DeFi, Gaming) und wie stark ist dieses Narrativ gerade?
6. SOCIAL (grob über Websuche): Wie viel und wie wird gerade über den Coin gesprochen (X, Reddit, News)? Steigt das Interesse?

Bewerte mit 0–10 (10 = sehr gut für Token-Holder). Erfinde nichts; wenn du etwas nicht findest, schreibe "nicht gefunden" bzw. null.
Antworte NUR mit JSON in genau diesem Format:
{"revenue":{"score":0,"answer":""},
"tokenomics":{"score":0,"buyback_burn":"","has_value_capture":true,"supply":"","inflation_pct_year":null,"insider_share_pct":null,"insider_majority":null,"large_unlock_30d":false,"net_supply":"schrumpfend|stabil|wachsend|unklar","unlocks":[{"date":"YYYY-MM-DD","tokens":"","usd":"","pct_circ":0.0,"recipient":""}],"answer":""},
"utility":{"score":0,"answer":""},
"catalysts":{"score":0,"answer":"","items":[{"date":"","event":"","impact":"positiv|negativ|unklar"}]},
"narrative":"",
"social_fallback":{"score":0,"answer":""},
"red_flags":[""],"fazit":"2–3 Sätze","sources":["https://..."]}`;
}
function socialPrompt(r){
  const m = mem.mkt[r.id];
  return `Analysiere mit der X-Suche die Posts der letzten 30 Tage über den Krypto-Coin ${r.name} ($${r.sym})${m && m.twitter ? `, offizieller Account @${m.twitter}` : ""}.
Fragen: Steigt die Zahl der Erwähnungen? Wie ist die Stimmung? Gibt es frühes Interesse von glaubwürdigen Accounts, bevor die breite Masse aufspringt? Gibt es Anzeichen für Bots, bezahlte Influencer-Werbung oder Pump-Gruppen?
Bewerte das Social-Momentum mit 0–10 (10 = stark wachsendes, echtes Interesse; Hype durch Bots/bezahlte Posts zählt negativ).
Antworte NUR mit JSON: {"score":0,"mentions_trend":"steigend|stabil|fallend","sentiment":"positiv|neutral|negativ|gemischt","early_interest":false,"bot_or_paid_suspected":false,"summary":"3–4 Sätze auf Deutsch","top_accounts":["@..."]}`;
}
async function runAnalysis(id){
  const r = results.find(x => x.id === id);
  if(!settings.aKey && !settings.xKey){ cur.err.deep = "Bitte zuerst unter ⚙︎ einen Anthropic-API-Key eintragen (und optional einen xAI-Key für X)."; renderDetail(); return; }
  cur.err.deep = null; cur.err.soc = null;
  if(!mem.mkt[id]){ try{ await loadMarket(id); }catch(_){ } }
  const jobs = [];
  if(settings.aKey){
    busy["deep" + id] = true;
    jobs.push(claude(deepPrompt(r), 10, 6000).then(t => {
      const p = parseJ(t) || { fazit: t.trim().slice(0, 3000) };
      p._date = new Date().toLocaleDateString("de-DE"); deep[id] = p; store.set("ac_deep2", deep);
    }).catch(e => { if(cur && cur.id === id) cur.err.deep = e.message; }).finally(() => { busy["deep" + id] = false; if(cur && cur.id === id) renderDetail(); }));
    if(!bm[id] && !busy["bm" + id]) genBusinessModel(r);
  } else cur.err.deep = "Ohne Anthropic-Key fehlen Revenue/Tokenomics/Katalysatoren aus der Recherche.";
  if(settings.xKey){
    busy["soc" + id] = true;
    jobs.push(grok(socialPrompt(r)).then(t => {
      const p = parseJ(t); if(!p) throw new Error("Antwort nicht lesbar");
      p._date = new Date().toLocaleDateString("de-DE"); social[id] = p; store.set("ac_social", social);
    }).catch(e => { if(cur && cur.id === id) cur.err.soc = e.message; }).finally(() => { busy["soc" + id] = false; if(cur && cur.id === id) renderDetail(); }));
  }
  renderDetail();
  await Promise.all(jobs);
}

  <div class="field"><label>Anzahl Coins (nach Market Cap)</label>

  <div class="field"><label>CoinGecko Demo-API-Key (empfohlen)</label><input id="sCg" value="${esc(settings.cgKey)}" placeholder="CG-…" autocomplete="off">
    <div class="hint">Kostenlos auf coingecko.com/de/api. Macht die Detailansicht deutlich schneller und verhindert „Rate-Limit“.</div></div>
  <div class="field"><label>Anthropic-API-Key (KI-Analyse & Geschäftsmodell)</label><input id="sAk" type="password" value="${esc(settings.aKey)}" placeholder="sk-ant-…" autocomplete="off">
    <div class="hint">Von console.anthropic.com. Bleibt nur auf diesem Gerät. Ca. 5–20 Cent pro Coin-Analyse.</div></div>
  <div class="field"><label>Claude-Modell</label><input id="sModel" value="${esc(settings.model)}"></div>
  <div class="field"><label>xAI-API-Key (Grok, für X-Analyse)</label><input id="sXk" type="password" value="${esc(settings.xKey)}" placeholder="xai-…" autocomplete="off">
    <div class="hint">Von console.x.ai. Optional – ohne Key schätzt Claude die Social-Lage über die Websuche.</div></div>
  <div class="field"><label>Grok-Modell</label><input id="sXm" value="${esc(settings.xModel)}"></div>
  <button class="btn" id="bSave">Speichern</button>
  <button class="btn alt" id="bClear">Alle KI-Ergebnisse & Bewertungen löschen</button>
  <div class="disc">Daten: CoinGecko, DefiLlama · KI: Claude, Grok · Keine Anlageberatung.</div>`;
  $("#detail").classList.add("open"); $("#detail").scrollTop = 0; history.pushState({ s: 1 }, "");
  $("#bBack").onclick = () => history.back();
  $("#bSave").onclick = () => {
    settings = { top: +$("#sTop").value, cgKey: $("#sCg").value.trim(), aKey: $("#sAk").value.trim(), model: $("#sModel").value.trim() || "claude-sonnet-5-5",
      xKey: $("#sXk").value.trim(), xModel: $("#sXm").value.trim() || "grok-4.5" };
    store.set("ac_settings", settings); history.back();
  };
  $("#bClear").onclick = () => {
    for(const o of [deep, social, bm, manual, full]) for(const k in o) delete o[k];
    ["ac_deep2","ac_social","ac_bm","ac_manual","ac_full"].forEach(k => store.set(k, {}));
    history.back();
  };
}
